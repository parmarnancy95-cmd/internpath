<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternPath - Resume Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="no-print">
        <h1>📄 InternPath</h1>
        <button id="download-btn">⬇️ Download PDF</button>
    </header>

    <div class="app-container">
        <div class="form-section no-print">
            <h3>Enter Your Details</h3>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="input-name" placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label>Job Title</label>
                <input type="text" id="input-title" placeholder="">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="input-email" placeholder="nancy@example.com">
            </div>
            <div class="input-group">
                <label>Skills (Comma separated)</label>
                <input type="text" id="input-skills" placeholder="HTML, CSS, JavaScript">
            </div>
              <div class="input-group">
                <label>Experience</label>
                <input type="experience" id="input-experience" placeholder="6 month ,1 year">
            </div>
            <div class="input-group">
                <label>Poject section</label>
                <input type="experience" id="input-experience" placeholder="">
            </div>
             <div class="input-group">
                <label>Social Link</label>
                <input type="experience" id="input-experience" placeholder="">
            </div>
        </div>
        
<div class="template-selector">
  <h3>Tamplate</h3>
  <button class="tmpl-btn active" onclick="changeTemplate('modern')">(Blue)</button>
  <button class="tmpl-btn" onclick="changeTemplate('classic')"> (Black & White)</button>
  <button class="tmpl-btn" onclick="changeTemplate('minimal')"> (Minimalist)</button>
   <div class="resume-preview" id="resume-sheet">
            <div class="resume-header">
                <h1 id="view-name">Your Name</h1>
                <p id="view-title">Your Profession</p>
                <span id="view-email">email@example.com</span>
            </div>
            <hr>
           
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
